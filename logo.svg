<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Badge -->
  <rect width="100" height="100" rx="24" fill="#0c1110" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.4" />

  <!-- Shield Shape Silhouette -->
  <path d="M50 16 L76 28 C76 56 50 78 50 78 C50 78 24 56 24 28 Z" 
        fill="#131e1a" stroke="url(#neonGlow)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Cybernetic Power Dumbbell / Arm Motif -->
  <!-- Left Weight Plate -->
  <rect x="30" y="38" width="6" height="24" rx="2" fill="url(#neonGlow)" filter="url(#glow)" />
  <rect x="38" y="42" width="4" height="16" rx="1.5" fill="#3b82f6" />

  <!-- Dumbbell Handle Bar -->
  <rect x="42" y="47" width="16" height="6" rx="2" fill="#ffffff" />

  <!-- Right Weight Plate -->
  <rect x="58" y="42" width="4" height="16" rx="1.5" fill="#3b82f6" />
  <rect x="64" y="38" width="6" height="24" rx="2" fill="url(#neonGlow)" filter="url(#glow)" />

  <!-- AI Energy Circuit Nodes -->
  <circle cx="50" cy="30" r="3" fill="#4ade80" filter="url(#glow)" />
  <line x1="50" y1="33" x2="50" y2="45" stroke="#22c55e" stroke-width="2" stroke-dasharray="2 2" />
  
  <circle cx="50" cy="65" r="3.5" fill="#3b82f6" filter="url(#glow)" />
  <line x1="50" y1="55" x2="50" y2="62" stroke="#3b82f6" stroke-width="2" stroke-dasharray="2 2" />

  <!-- Tech Corner Dots -->
  <circle cx="28" cy="72" r="1.5" fill="#22c55e" opacity="0.8" />
  <circle cx="34" cy="76" r="2" fill="#22c55e" opacity="0.6" />
  <circle cx="66" cy="76" r="2" fill="#3b82f6" opacity="0.6" />
  <circle cx="72" cy="72" r="1.5" fill="#3b82f6" opacity="0.8" />
</svg>
